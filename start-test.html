<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brainify | Take Test</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background: linear-gradient(to right,#e0f7f5,#f0f0f0); color:#003f38;}
header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:20px 60px;background:rgba(255,255,255,0.8);backdrop-filter:blur(8px);position:fixed;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
header h1{font-size:1.8em;font-weight:700;color:#004d40;}
nav a{margin-left:30px;text-decoration:none;color:#004d40;font-weight:600;transition:0.3s;}
nav a:hover{color:#009688;}
.test-container{
  background:#fff; border-radius:20px; padding:30px; max-width:900px; margin:120px auto 50px; box-shadow:0 8px 20px rgba(0,0,0,0.1);
}
.question{margin-bottom:30px;}
.question h3{color:#004d40; margin-bottom:10px;}
.options button{display:block; width:100%; padding:12px; margin:6px 0; border:none; border-radius:10px; background:#e0f7f5; color:#004d40; cursor:pointer; transition:0.3s;}
.options button:hover{background:#00bfa6; color:#fff; transform:scale(1.02);}
#progress-bar{width:100%; background:#e0f7f5; height:15px; border-radius:10px; margin-bottom:20px;}
#progress{width:0%; height:15px; background:#00bfa6; border-radius:10px; transition:0.3s;}
.timer{font-size:1.1rem; font-weight:600; margin-bottom:20px; color:#004d40;}
.pop-up{
  position: fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0); background:#00bfa6; color:#fff;
  padding:20px 40px; border-radius:15px; font-size:1.2rem; font-weight:600; z-index:999; text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.2); transition:0.5s;
}
.submit-btn{padding:14px 50px; font-size:1.2rem; border:none; border-radius:50px; background:#004d40; color:#fff; font-weight:600; cursor:pointer; transition:0.3s;}
.submit-btn:hover{background:#009688; transform:scale(1.05);}
footer{background:#004d40;color:#fff;text-align:center;padding:30px 0;margin-top:50px;font-size:0.95rem;}
</style>
</head>
<body>
<header>
<h1>Brainify</h1>
<nav>
<a href="index.html">Home</a>
<a href="test.html">Take Test</a>
<!-- Pricing removed -->
<a href="certificate.html">Certificate</a>
<a href="contact.html">Contact</a>
</nav>
</header>

<div class="test-container">
<div class="timer" id="timer">Time Left: 15:00</div>
<div id="progress-bar"><div id="progress"></div></div>
<div id="question-container"></div>

</div>

<div class="pop-up" id="popup"></div>

<footer>© 2025 Brainify | Designed by G Manoj Kumar</footer>

<script>
const questions = [
  {q:"A man has 53 socks: 21 blue, 15 black, 17 red. How many must he take to ensure a matching pair?", options:["2","3","4","5"], answer:1},
  {q:"Find the missing number: 2, 6, 12, 20, 30, ?", options:["36","40","42","45"], answer:2},
  {q:"If all Bloops are Razzies and all Razzies are Lazzies, are all Bloops definitely Lazzies?", options:["Yes","No","Can't Tell","Sometimes"], answer:0},
  {q:"Which number completes the series: 1, 1, 2, 3, 5, 8, ?", options:["11","12","13","14"], answer:2},
  {q:"If 5 cats can catch 5 mice in 5 minutes, how many cats needed to catch 100 mice in 100 minutes?", options:["5","10","20","25"], answer:0},
  {q:"A clock shows 3:15. What is the angle between hour and minute hands?", options:["0°","7.5°","52.5°","45°"], answer:2},
  {q:"Which word does not belong: Apple, Banana, Carrot, Orange?", options:["Apple","Banana","Carrot","Orange"], answer:2},
  {q:"If a train travels 60 km in 1 hour, how long will it take to travel 180 km?", options:["1hr","2hr","3hr","4hr"], answer:2},
  {q:"If 3 pencils cost 15₹, how much do 7 pencils cost?", options:["30₹","35₹","32₹","25₹"], answer:1},
  {q:"Which number is next: 2, 4, 8, 16, ?", options:["18","20","32","24"], answer:2},
  {q:"If a bag contains 5 red and 5 blue balls, probability of picking blue?", options:["0.25","0.5","0.75","0.6"], answer:1},
  {q:"Solve: If x+3=7, what is x?", options:["3","4","5","6"], answer:1},
  {q:"Which is heavier: 1kg steel or 1kg feathers?", options:["Steel","Feathers","Equal","Can't tell"], answer:2},
  {q:"Find the missing number: 5,10,20,40,?", options:["60","70","80","90"], answer:2},
  {q:"A jar contains 10 coins. If you pick 2 at random, probability they are both heads?", options:["1/45","1/5","1/10","1/9"], answer:0},
  {q:"If all roses are flowers and some flowers fade quickly, can we say some roses fade quickly?", options:["Yes","No","Can't tell","Sometimes"], answer:2},
  {q:"Which word is an antonym of 'Optimistic'?", options:["Hopeful","Positive","Pessimistic","Joyful"], answer:2},
  {q:"What comes next: 3, 9, 27, ?", options:["54","72","81","90"], answer:2},
  {q:"If a rectangle has length 10 and width 5, area?", options:["15","50","25","40"], answer:1},
  {q:"A cube has volume 27. What is its side?", options:["3","9","6","27"], answer:0},
  {q:"Which is logical: All cats are animals. Some animals are dogs. Conclusion?", options:["Valid","Invalid","Can't tell","None"], answer:1},
  {q:"Find the missing number: 7,14,28,?", options:["42","49","56","54"], answer:2},
  {q:"If you rearrange 'LISTEN' you get?", options:["SILENT","ENLIST","TINSEL","All"], answer:3},
  {q:"How many times does the digit 3 appear between 1-100?", options:["19","20","21","22"], answer:0},
  {q:"If a cube is painted on all faces and cut into 8 smaller cubes, how many cubes have 3 painted faces?", options:["0","1","2","8"], answer:2},
  {q:"Which is next: 1,4,9,16, ?", options:["20","25","30","36"], answer:1},
  {q:"If 2 pencils cost 10₹, 5 pencils?", options:["20₹","25₹","30₹","15₹"], answer:1},
  {q:"Which is next: 2,5,10,17, ?", options:["26","28","30","32"], answer:0},
  {q:"Solve: 3x-5=10, x=?", options:["5","3","10","15"], answer:0},
  {q:"If A is faster than B, and B is faster than C, who is the slowest?", options:["A","B","C","Can't say"], answer:2},

];

let currentQuestion=0;
let score=0;
let totalQuestions=questions.length;

const questionContainer=document.getElementById('question-container');
const progress=document.getElementById('progress');
const popup=document.getElementById('popup');

function showQuestion(){
  questionContainer.innerHTML="";
  let q=questions[currentQuestion];
  let qDiv=document.createElement('div');
  qDiv.classList.add('question');
  qDiv.innerHTML=`<h3>Q${currentQuestion+1}. ${q.q}</h3>`;
  let optsDiv=document.createElement('div');
  optsDiv.classList.add('options');
  q.options.forEach((opt,i)=>{
    let btn=document.createElement('button');
    btn.textContent=opt;
    btn.onclick=()=>{checkAnswer(i);};
    optsDiv.appendChild(btn);
  });
  qDiv.appendChild(optsDiv);
  questionContainer.appendChild(qDiv);
  progress.style.width=((currentQuestion)/totalQuestions*100)+'%';
}

function checkAnswer(selected){
  if(selected===questions[currentQuestion].answer){
    score++;
  }
  currentQuestion++;
  if(currentQuestion%10===0 && currentQuestion!==totalQuestions){
    showPopup(`Great! You are doing ${(score/totalQuestions*100).toFixed(0)}% better than others!`);
  }
  if(currentQuestion<totalQuestions){
    showQuestion();
  } else {
    // Test finished
    submitTest();
  }
}

function showPopup(msg){
  popup.textContent=msg;
  popup.style.transform="translate(-50%,-50%) scale(1)";
  setTimeout(()=>{popup.style.transform="translate(-50%,-50%) scale(0)";},2500);
}

// ✅ Submit Test
function submitTest(){
  // Prompt for participant name
  const username = prompt("Enter your name:","Participant");
  localStorage.setItem("username", username || "Participant");
  localStorage.setItem("iqScore", score); // store score as IQ placeholder
  localStorage.setItem("testCompleted","true"); // flag test completion

  // Redirect to pricing page
  window.location.href = "pricing.html";
}

// Initialize
showQuestion();

// TIMER
let time=15*60; // 15 minutes
const timerEl=document.getElementById('timer');
const timerInterval = setInterval(()=>{
  let min=Math.floor(time/60);
  let sec=time%60;
  timerEl.textContent=`Time Left: ${min}:${sec<10?'0'+sec:sec}`;
  time--;
  if(time<0){ clearInterval(timerInterval); submitTest(); }
},1000);
</script>
</body>
</html>
